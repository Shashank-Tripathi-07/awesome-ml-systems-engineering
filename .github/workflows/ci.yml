name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  awesome-lint:
    name: awesome-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Run awesome-lint
        run: npx awesome-lint https://github.com/Shashank-Tripathi-07/awesome-ml-systems-engineering
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - name: Lint markdown structure (PRs)
        run: npx markdownlint-cli README.md --config .markdownlint.json || true
        if: github.event_name == 'pull_request'

  link-check:
    name: link-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v1
        with:
          args: >
            --verbose
            --no-progress
            --exclude-mail
            --max-retries 5
            --retry-wait-time 10
            --timeout 45
            --max-concurrency 32
            --accept 403,415,429,999
            --exclude "reddit\\.com"
            --exclude "linkedin\\.com"
            --exclude "twitter\\.com"
            --exclude "x\\.com"
            --exclude "discord\\.gg"
            --exclude "discord\\.com"
            --exclude "elsevier\\.com"
            --exclude "oreilly\\.com"
            --exclude "coursera\\.org"
            --exclude "uber\\.com"
            --exclude "usenix\\.org"
            --exclude "mcunet\\.mit\\.edu"
            --exclude "iscaconf\\.org"
            --exclude "asplos-conference\\.org"
            --exclude "rdmaconsortium\\.org"
            --exclude "supercomputing\\.org"
            --exclude "mlebook\\.com"
            README.md
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
